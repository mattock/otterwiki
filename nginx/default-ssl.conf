server {
    listen       443 ssl;
    server_name  ${OTTERWIKI_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${OTTERWIKI_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${OTTERWIKI_DOMAIN}/privkey.pem;
    client_max_body_size 0;

    location / {
        try_files $uri @app;
    }

    location @app {
        uwsgi_pass web:9090;
        include /etc/nginx/uwsgi_params;
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static {
        alias /app/otterwiki/static;
    }

    # Redirect individual pages
    location = /openvpn/query                                    { return 301 https://github.com/OpenVPN/openvpn/issues; }
    location = /openvpn/report                                   { return 301 https://github.com/OpenVPN/openvpn/issues; }
    location = /openvpn/login                                    { return 301 $scheme://$host/Pages/WikiCredentials; }
    location = /openvpn/about                                    { return 301 $scheme://$host/-/about; }
    location = /openvpn/search                                   { return 301 $scheme://$host; }
    location = /openvpn/wiki/WikiStart                           { return 301 $scheme://$host; }
    location = /openvpn/wiki/TitleIndex                          { return 301 $scheme://$host; }
    location = /openvpn/wiki/DataChannelOffload                  { return 301 $scheme://$host/DataChannelOffload; }
    location = /openvpn/wiki/Downloads                           { return 301 $scheme://$host/Downloads; }
    location = /openvpn/wiki/HOWTO                               { return 301 $scheme://$host/HOWTO; }
    location = /openvpn/wiki/IrcMeetings                         { return 301 $scheme://$host/Meetings; }
    location = /openvpn/wiki/RecentChanges                       { return 301 $scheme://$host/-/changelog; }
    location = /openvpn/timeline                                 { return 301 $scheme://$host/-/changelog; }
    location = /openvpn/wiki/UnofficialOpenvpnSoftwareRepos      { return 301 $scheme://$host/Pages/OpenVPN%20software%20repos; }

    # Redirect Changelog pages
    location = /openvpn/wiki/ChangesInOpenvpn1x { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN1x; }
    location = /openvpn/wiki/ChangesInOpenvpn20 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN20; }
    location = /openvpn/wiki/ChangesInOpenvpn21 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN21; }
    location = /openvpn/wiki/ChangesInOpenvpn22 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN22; }
    location = /openvpn/wiki/ChangesInOpenvpn23 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN23; }
    location = /openvpn/wiki/ChangesInOpenvpn24 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN24; }
    location = /openvpn/wiki/ChangesInOpenvpn25 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN25; }
    location = /openvpn/wiki/ChangesInOpenvpn26 { return 301 $scheme://$host/Changelogs/ChangesInOpenVPN26; }

    # Redirect Development pages
    location = /openvpn/wiki/Contributing                     { return 301 $scheme://$host/Development/Contributing; }
    location = /openvpn/wiki/DeveloperDocumentation           { return 301 $scheme://$host/Development/DeveloperDocumentation; }
    location = /openvpn/wiki/TesterDocumentation              { return 301 $scheme://$host/Development/TesterDocumentation; }
    location = /openvpn/wiki/ServerSideTestingImprovementPlan { return 301 $scheme://$host/Development/ServerSideTestingImprovementPlan; }
    location = /openvpn/wiki/StatusOfOpenvpn24                { return 301 $scheme://$host/Development/StatusOfOpenvpn24; }
    location = /openvpn/wiki/StatusOfOpenvpn25                { return 301 $scheme://$host/Development/StatusOfOpenvpn25; }
    location = /openvpn/wiki/StatusOfOpenvpn26                { return 301 $scheme://$host/Development/StatusOfOpenvpn26; }
    location = /openvpn/wiki/StatusOfOpenvpn27                { return 301 $scheme://$host/Development/StatusOfOpenvpn27; }

    # Redirect security announcements that do not follow the CVE naming format
    location = /openvpn/wiki/SecurityAnnouncement-f375aa67cc           { return 301 $scheme://$host/Security%20Announcements/SecurityAnnouncement-f375aa67cc; }
    location = /openvpn/wiki/TLSTripleHandshakeVulnerabilityAndOpenVPN { return 301 $scheme://$host/Security%20Announcements/TLSTripleHandshakeVulnerabilityAndOpenVPN; }
    location = /openvpn/wiki/heartbleed                                { return 301 $scheme://$host/Security%20Announcements/heartbleed ; }
    location = /openvpn/wiki/CCSInjection                              { return 301 $scheme://$host/Security%20Announcements/CCSInjection; }
    location = /openvpn/wiki/VORACLE                                   { return 301 $scheme://$host/Security%20Announcements/VORACLE; }
    location = /openvpn/wiki/VulnerabilitiesFixedInOpenSSL1.0.1i       { return 301 $scheme://$host/Security%20Announcements/VulnerabilitiesFixedInOpenSSL1_0_1i; }
    location = /openvpn/wiki/VulnerabilitiesFixedInOpenSSL1.0.1j       { return 301 $scheme://$host/Security%20Announcements/VulnerabilitiesFixedInOpenSSL1_0_1j; }
    location = /openvpn/wiki/SecurityAnnouncement-97597e732b           { return 301 $scheme://$host/Security%20Announcements/SecurityAnnouncement-97597e732b; }
    location = /openvpn/wiki/SecurityAnnouncement-FREAK                { return 301 $scheme://$host/Security%20Announcements/SecurityAnnouncement-FREAK; }
    location = /openvpn/wiki/VulnerabilitiesFixedInOpenSSL1.0.1m       { return 301 $scheme://$host/Security%20Announcements/VulnerabilitiesFixedInOpenSSL1.0.1m; }
    location = /openvpn/wiki/TapWindows6BufferOverflowVulnerability    { return 301 $scheme://$host/Security%20Announcements/TapWindows6BufferOverflowVulnerability; }
    location = /openvpn/wiki/SWEET32                                   { return 301 $scheme://$host/Security%20Announcements/SWEET32; }
    location = /openvpn/wiki/QuarkslabAndCryptographyEngineerAudits    { return 301 $scheme://$host/Security%20Announcements/QuarkslabAndCryptographyEngineerAudits; }
    location = /openvpn/wiki/VulnerabilitiesFixedInOpenVPN243          { return 301 $scheme://$host/Security%20Announcements/VulnerabilitiesFixedInOpenVPN243; }
    location = /openvpn/wiki/UnquotedServicePathIn24WindowsInstallers  { return 301 $scheme://$host/Security%20Announcements/UnquotedServicePathIn24WindowsInstallers; }
    location = /openvpn/wiki/NSISBug1125                               { return 301 $scheme://$host/Security%20Announcements/NSISBug1125; }
    location = /openvpn/wiki/DUHKattack                                { return 301 $scheme://$host/Security%20Announcements/DUHKattack; }
    location = /openvpn/wiki/TunnelCrack                               { return 301 $scheme://$host/Security%20Announcements/TunnelCrack; }

    # Redirect community meetup pages
    location = /openvpn/wiki/MunichHackathon2013    { return 301 $scheme://$host/Meetups/2013-Munich; }
    location = /openvpn/wiki/MunichHackathon2014    { return 301 $scheme://$host/Meetups/2014-Munich; }
    location = /openvpn/wiki/DelftHackathon2015     { return 301 $scheme://$host/Meetups/2015-Delft; }
    location = /openvpn/wiki/HelsinkiHackathon2016  { return 301 $scheme://$host/Meetups/2016-Helsinki; }
    location = /openvpn/wiki/KarlsruheHackathon2017 { return 301 $scheme://$host/Meetups/2017-Karlsruhe; }
    location = /openvpn/wiki/LvivHackathon2018      { return 301 $scheme://$host/Meetups/2018-Lviv; }
    location = /openvpn/wiki/TrentoHackathon2019    { return 301 $scheme://$host/Meetups/2019-Trento; }
    location = /openvpn/wiki/Hackathon2021          { return 301 $scheme://$host/Meetups/2021-Munich; }
    location = /openvpn/wiki/Hackathon2022          { return 301 $scheme://$host/Meetups/2022-Delft; }
    location = /openvpn/wiki/Hackathon2023          { return 301 $scheme://$host/Meetups/2023-Orihuela; }
    location = /openvpn/wiki/CommunityMeetup2024    { return 301 $scheme://$host/Meetups/2024-Karlsruhe; }
    location = /openvpn/wiki/CommunityMeetup2025    { return 301 $scheme://$host/Meetups/2025-Naples; }

    # Redirect various pages that have been renamed
    location = /openvpn/wiki/Easy_Windows_Guide        { return 301 $scheme://$host/Pages/Easy%20Windows%20Guide; }
    location = /openvpn/wiki/DeprecatedOptions         { return 301 $scheme://$host/Pages/Deprecated%20options; }
    location = /openvpn/wiki/SupportedVersions         { return 301 $scheme://$host/Pages/Supported%20versions; }
    location = /openvpn/wiki/GettingTapWindows         { return 301 $scheme://$host/Pages/Getting%20tap-windows; }
    location = /openvpn/wiki/OpenvpnSoftwareRepos      { return 301 $scheme://$host/Pages/OpenVPN%20software%20repos; }
    location = /openvpn/wiki/ManagingWindowsTAPDrivers { return 301 $scheme://$host/Pages/Managing%20TAP-Windows%20drivers; }
    location = /openvpn/wiki/GettingStartedwithOVPN    { return 301 $scheme://$host/Pages/Getting%20started%20with%20OpenVPN; }
    location = /openvpn/wiki/OpenVPN-GUI               { return 301 $scheme://$host/Pages/OpenVPN-GUI-New; }
    location = /openvpn/wiki/SecurityAnnouncements     { return 301 $scheme://$host/Security%20Announcements; }
    location = /openvpn/wiki/GettingHelp               { return 301 $scheme://$host/Pages/Getting%20help; }
    location = /openvpn/wiki/OpenVPN-systemd-use       { return 301 $scheme://$host/Pages/Systemd; }
    location = /openvpn/wiki/OpenVPNInteractiveService { return 301 $scheme://$host/Pages/OpenVPNInteractiveservice; }

    #location =   { return 301 $scheme://$host/; }
    #location =   { return 301 $scheme://$host/; }
    #location =   { return 301 $scheme://$host/; }

    # Redirect individual archived pages
    location = /openvpn/wiki/BuildingUsingGenericBuildsystem { return 301 $scheme://$host/Archived/BuildingUsingGenericBuildsystem; }
    location = /openvpn/wiki/DynamicDNS                      { return 301 $scheme://$host/Archived/DynamicDNS; }
    location = /openvpn/wiki/GettingOpenvpnBuild             { return 301 $scheme://$host/Archived/GettingOpenvpnBuild; }
    location = /openvpn/wiki/HLKTesting                      { return 301 $scheme://$host/Archived/HLKTesting; }
    location = /openvpn/wiki/IOSinline                       { return 301 $scheme://$host/Archived/IOSinline; }
    location = /openvpn/wiki/Nonprivileged                   { return 301 $scheme://$host/Archived/Nonprivileged; }
    location = /openvpn/wiki/OpenvpnMSIInstaller             { return 301 $scheme://$host/Archived/OpenvpnMSIInstaller; }
    location = /openvpn/wiki/Gigabit_Networks_Linux          { return 301 $scheme://$host/Archived/Optimizing%20Performance%20on%20Gigabit%20Networks; }
    location = /openvpn/wiki/PerformanceTesting              { return 301 $scheme://$host/Archived/PerformanceTesting; }
    location = /openvpn/wiki/RoadMap                         { return 301 $scheme://$host/Archived/RoadMap; }
    location = /openvpn/wiki/SecurityOverview                { return 301 $scheme://$host/Archived/SecurityOverview; }
    location = /openvpn/wiki/StaticKeyMiniHowto              { return 301 $scheme://$host/Archived/StaticKeyMiniHowto; }

    # Redirect any at or below this path
    location /account       { return 301 $scheme://$host/Pages/WikiCredentials; }
    location /pwm           { return 301 $scheme://$host/Pages/WikiCredentials; }
    location /register      { return 301 $scheme://$host/Pages/WikiCredentials; }
    location /openvpn/prefs { return 301 $scheme://$host; }

    # Redirect DataChannelOffload child pages
    location ~ ^/openvpn/wiki/(?<dco_page>DataChannelOffload/.*) { return 301 $scheme://$host/$dco_page; }

    # Redirect IRC meeting pages (this should work on the vast majority of pages)
    location ~ ^/openvpn/wiki/Topics-(?<year>20\d\d)-(?<month>\d\d)-(?<day>\d\d) { return 301 $scheme://$host/Meetings/$year/$year-$month-$day; }

    # Redirect FAQ pages
    location ~ ^/openvpn/wiki/(?<faq_page>\d\d\d-.*) { return 301 $scheme://$host/FAQ/$faq_page; }

    # Redirect CVE pages
    location ~ ^/openvpn/wiki/(?<cve_page>CVE-\d\d\d\d-\d\d\d\d\d*) { return 301 $scheme://$host/Security%20Announcements/$cve_page; }

    # Redirect other Trac wiki URLs to matching page under /Pages
    location ~ ^/openvpn/wiki/(?<page>.*) { return 301 $scheme://$host/Pages/$page; }

    location /openvpn {
        root /usr/share/nginx/openvpn;
        try_files $uri $uri/ $uri.html =404;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        location /openvpn/ticket {
            default_type "text/html";
        }
     }
}
